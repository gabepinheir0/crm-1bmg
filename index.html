sb.auth.onAuthStateChange(async(ev,session)=>{if(session){U=session.user;document.getElementById('auth').style.display='none';document.getElementById('app').classList.add('on');document.getElementById('uchip').textContent=U.user_metadata?.full_name||U.email.split('@')[0];const n=new Date();calY=n.getFullYear();calM=n.getMonth();await loadAll();render();}else{document.getElementById('auth').style.display='flex';document.getElementById('app').classList.remove('on');}});

// LOAD
async function getToken(){try{const{data}=await sb.auth.getSession();return data?.session?.access_token||SB_KEY;}catch{return SB_KEY;}}
async function apiFetch(table,params=''){const tok=await getToken();const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok}});if(!r.ok)throw new Error(await r.text());return r.json();}
async function apiInsert(table,data){const tok=await getToken();const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());const d=await r.json();return Array.isArray(d)?d[0]:d;}
async function apiUpdate(table,data,filter){const tok=await getToken();const r=await fetch(`${SB_URL}/rest/v1/${table}?${filter}`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function apiDelete(table,filter){const tok=await getToken();const r=await fetch(`${SB_URL}/rest/v1/${table}?${filter}`,{method:'DELETE',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok}});if(!r.ok)throw new Error(await r.text());}
async function apiUpsert(table,data,conflict){const tok=await getToken();const r=await fetch(`${SB_URL}/rest/v1/${table}?on_conflict=${conflict}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':'Bearer '+tok,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(data)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function loadAll(){try{const[c,t,ch,m,p,o,n,f]=await Promise.all([apiFetch('clients','order=name'),apiFetch('tasks', U?.id ? `owner_id=eq.${U.id}&order=due_date` : 'order=due_date'),apiFetch('checklist_items', U?.id ? `user_id=eq.${U.id}` : ''),apiFetch('channel_metrics',''),apiFetch('projects', U?.id ? `owner_id=eq.${U.id}` : ''),apiFetch('okrs', U?.id ? `owner_id=eq.${U.id}` : ''),apiFetch('notes',''),apiFetch('files', U?.id ? `owner_id=eq.${U.id}` : '')]);CLIENTS=c||[];TASKS=t||[];CHECKS={};(ch||[]).forEach(x=>CHECKS[x.key]=x.done);METRICS={};(m||[]).forEach(x=>METRICS[`${x.client_id}|${x.channel_index}|${x.week_key}`]=x);PROJECTS=p||[];OKRS=o||[];NOTES={};(n||[]).forEach(x=>NOTES[x.client_id]=x);FILES={};(f||[]).forEach(x=>{if(!FILES[x.client_id])FILES[x.client_id]=[];FILES[x.client_id].push(x);});}catch(e){document.getElementById('main-body').innerHTML=`<div class="empty"><i class="ti ti-alert-circle"></i><p>Erro ao carregar dados.<br><small>${e.message}</small><br><br><button class="btn" onclick="loadAll().then(render)">Tentar novamente</button></p></div>`;}}

// NAV
function goTab(t){tab=t;catF='all';sq='';document.querySelectorAll('.nt').forEach(e=>e.classList.remove('on'));document.getElementById('nt-'+t)?.classList.add('on');closeCp();render();}
function render(){const ba=document.getElementById('main-body');ba.innerHTML='';if(tab==='dash')rDash(ba);else if(tab==='clients')rClients(ba);else if(tab==='calendar')rCalendar(ba);else if(tab==='checklist')rChecklist(ba);else if(tab==='checkcanal')rCheckCanal(ba);else if(tab==='projects')rProjects(ba);else if(tab==='okr')rOKR(ba);else if(tab==='tasks')rTasks(ba);}

// DASHBOARD
function rDash(ba){const total=CLIENTS.length,totalR=CLIENTS.reduce((s,c)=>s+(c.rev_1bmg||0),0),totalC=CLIENTS.reduce((s,c)=>s+(c.channels||[]).length,0),hr=CLIENTS.filter(c=>c.risk==='Alto').length,now=new Date(),tod=today();const todT=TASKS.filter(t=>t.due_date===tod&&t.status!=='done');const friT=TASKS.filter(t=>{if(!t.due_date||t.status==='done')return false;return new Date(t.due_date+'T12:00').getDay()===5;}).slice(0,5);const ov=TASKS.filter(t=>t.due_date&&t.due_date<tod&&t.status!=='done').length;const bd=CLIENTS.filter(c=>c.birthday&&new Date(c.birthday+'T12:00').getMonth()===now.getMonth()).sort((a,b)=>new Date(a.birthday).getDate()-new Date(b.birthday).getDate());const cats=['0. Diamante','1. Ouro','2. Prata','3. Bronze'],cN=['Diamante','Ouro','Prata','Bronze'],cC=['bd','bgo','bs','bb'];const catR=cats.map((c,i)=>{const cs=CLIENTS.filter(x=>x.category===c);const r=cs.reduce((s,x)=>s+(x.rev_1bmg||0),0);return`<div class="ir"><span class="il"><span class="badge ${cC[i]}">${cN[i]}</span></span><span class="iv">${cs.length} · ${fmt(r)}/ano</span></div>`;}).join('');const top5=CLIENTS.slice().sort((a,b)=>(b.rev_1bmg||0)-(a.rev_1bmg||0)).slice(0,5).map(c=>`<div class="ir" style="cursor:pointer" onclick="openCp('${c.id}')"><span class="il" style="display:flex;align-items:center;gap:8px"><div class="av ${avC(c.category)}" style="width:26px;height:26px;font-size:10px;flex-shrink:0">${c.photo?`<img src="${c.photo}" alt="">`:ini(c.name)}</div>${c.name}</span><span class="iv">${fmt(c.rev_1bmg)}</span></div>`).join('');const alerts=CLIENTS.filter(c=>c.risk!=='Baixo'||(c.obs||'').toLowerCase().includes('desmon')||(c.obs||'').toLowerCase().includes('não está no cms'));const alertR=alerts.length?alerts.map(c=>`<div class="ir"><span class="il">${c.name}</span><span class="iv">${rE(c.risk)}</span></div>`).join(''):'<div style="color:var(--txt3);font-size:13px;padding:8px 0"><i class="ti ti-circle-check"></i> Nenhum alerta</div>';const todHTML=todT.length?todT.slice(0,6).map(t=>{const c=CLIENTS.find(x=>x.id===t.client_id);return`<div class="trow"><div class="tchk${t.status==='done'?' on':''}" onclick="qDone('${t.id}')"></div><span class="tcli">${c?c.name.split(' ')[0]:'Geral'}</span><span class="ttask${t.status==='done'?' cit on':''}">${t.title}</span>${pB(t.priority)}</div>`;}).join(''):'<div style="color:var(--txt3);font-size:13px;padding:8px 0"><i class="ti ti-check"></i> Nenhuma tarefa para hoje</div>';const friHTML=friT.length?friT.map(t=>{const c=CLIENTS.find(x=>x.id===t.client_id);return`<div class="trow"><span class="tcli">${c?c.name.split(' ')[0]:'Geral'}</span><span class="ttask">${t.title}</span>${pB(t.priority)}</div>`;}).join(''):'<div style="color:var(--txt3);font-size:13px;padding:8px 0">Nenhuma tarefa para sexta</div>';ba.innerHTML=`<div class="vhdr"><h1>Dashboard</h1>${ov>0?`<span class="badge bred"><i class="ti ti-alert-circle"></i>${ov} vencida${ov>1?'s':''}</span>`:''}<div style="margin-left:auto;display:flex;gap:8px"><div class="srch"><i class="ti ti-search" style="font-size:15px;color:var(--txt3)"></i><input type="text" placeholder="Buscar..." oninput="sq=this.value;goTab('clients')"></div><button class="btn btn-p btn-sm" onclick="openClientMod()"><i class="ti ti-plus"></i>Novo cliente</button></div></div><div class="scroll"><div class="g4"><div class="mc"><div class="ml">Clientes</div><div class="mv">${total}</div><div class="ms">${totalC} canais</div></div><div class="mc"><div class="ml">Receita 1BMG / ano</div><div class="mv" style="font-size:18px">${fmt(totalR)}</div><div class="ms">Carteira total</div></div><div class="mc"><div class="ml">Receita média / mês</div><div class="mv" style="font-size:18px">${fmt(totalR/12)}</div><div class="ms">Projeção</div></div><div class="mc"><div class="ml">Risco de churn</div><div class="mv" style="color:${hr>0?'#A32D2D':'#1D9E75'}">${hr}</div><div class="ms">Em atenção</div></div></div><div class="g2"><div><div class="card"><div class="ctitle"><i class="ti ti-sun"></i>Para fazer hoje <span style="font-size:11px;font-weight:400;color:var(--txt3)">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</span></div>${todHTML}<button class="btn btn-sm" style="margin-top:10px" onclick="openTaskMod(null,today())"><i class="ti ti-plus"></i>Adicionar tarefa</button></div><div class="card"><div class="ctitle"><i class="ti ti-calendar-week"></i>Para fazer essa sexta <span class="badge bblu" style="font-size:10px">Semanal</span></div>${friHTML}</div>${bd.length?`<div class="card"><div class="ctitle"><i class="ti ti-cake"></i>Aniversários este mês</div>${bd.map(b=>`<div class="ir"><span class="il">${b.name}</span><span class="iv" style="color:var(--txt3)">${fd(b.birthday)}</span></div>`).join('')}</div>`:''}</div><div><div class="card" style="margin-bottom:14px"><div class="ctitle"><i class="ti ti-chart-pie"></i>Distribuição por categoria</div>${catR}</div><div class="card"><div class="ctitle"><i class="ti ti-trophy"></i>Top por receita</div>${top5}</div></div></div><div class="card"><div class="ctitle"><i class="ti ti-alert-triangle"></i>Alertas e atenção</div>${alertR}</div></div>`;}

// CLIENTS
function rClients(ba){const fl=CLIENTS.filter(c=>{const mc=catF==='all'||c.category===catF;const ms=!sq||c.name.toLowerCase().includes(sq)||(c.channels||[]).some(x=>x.toLowerCase().includes(sq));return mc&&ms;});const cats=['all','0. Diamante','1. Ouro','2. Prata','3. Bronze'],lbls=['Todos','Diamante','Ouro','Prata','Bronze'];const cards=fl.map(c=>`<div class="cc" onclick="openCp('${c.id}')"><div class="rx" style="margin-bottom:12px"><div class="av ${avC(c.category)}">${c.photo?`<img src="${c.photo}" alt="">`:ini(c.name)}</div><div class="cx"><div class="ccn">${c.name}</div><div class="ccs">${(c.channels||[]).length} canal${(c.channels||[]).length!==1?'is':''} · ${c.niche||''}</div></div>${catB(c.category)}</div>${c.email||c.phone?`<div style="font-size:11px;color:var(--txt3);margin-bottom:8px">${c.email?`<i class="ti ti-mail" style="font-size:11px"></i> ${c.email} `:''}${c.phone?`<i class="ti ti-phone" style="font-size:11px"></i> ${c.phone}`:''}</div>`:''}<div class="dv" style="margin:8px 0"></div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--txt2)">Receita/mês</span><span style="font-weight:600">${fmt(c.rev_month)}</span></div><div style="display:flex;justify-content:space-between;font-size:12px"><span style="color:var(--txt2)">Risco</span><span>${rE(c.risk)}</span></div></div>`).join('');ba.innerHTML=`<div class="vhdr"><h1>Clientes</h1><div style="margin-left:auto;display:flex;gap:8px"><div class="srch"><i class="ti ti-search" style="font-size:15px;color:var(--txt3)"></i><input type="text" placeholder="Buscar..." value="${sq}" oninput="sq=this.value;render()"></div><button class="btn btn-p btn-sm" onclick="openClientMod()"><i class="ti ti-plus"></i>Novo</button></div></div><div class="scroll"><div class="pills">${cats.map((f,i)=>`<button class="pill${catF===f?' on':''}" onclick="catF='${f}';render()">${lbls[i]}</button>`).join('')}</div>${fl.length?`<div class="ccg">${cards}</div>`:`<div class="empty"><i class="ti ti-mood-empty"></i><p>Nenhum cliente encontrado</p></div>`}</div>`;}

// CALENDAR
function rCalendar(ba){ba.innerHTML=`<div class="vhdr"><h1>Calendário</h1><div style="display:flex;gap:6px;margin-left:auto"><button class="pill${calView==='month'?' on':''}" onclick="calView='month';render()">Mensal</button><button class="pill${calView==='week'?' on':''}" onclick="calView='week';render()">Semanal</button><button class="btn btn-p btn-sm" onclick="openTaskMod()"><i class="ti ti-plus"></i>Nova tarefa</button></div></div><div class="scroll" id="cal-area"></div>`;if(calView==='month')rMonth();else rWeek();}

function rMonth(){const area=document.getElementById('cal-area');const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),mname=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),tod=today();let days=[],sd=first.getDay();for(let i=sd-1;i>=0;i--)days.push({d:new Date(calY,calM,0-i),cur:false});for(let i=1;i<=last.getDate();i++)days.push({d:new Date(calY,calM,i),cur:true});while(days.length<42)days.push({d:new Date(calY,calM+1,days.length-last.getDate()-sd+1),cur:false});const dows=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const grid=days.map(({d,cur})=>{const ds=d.toISOString().slice(0,10);const isT=ds===tod;const dts=TASKS.filter(t=>t.due_date===ds);const dots=dts.slice(0,3).map(t=>`<div class="tdot ${t.status==='done'?'done':t.priority}" onclick="event.stopPropagation();openTDetail('${t.id}')">${t.title}</div>`).join('');return`<div class="calday${!cur?' om':''}${isT?' today':''}" onclick="openDayMod('${ds}')"><div class="caldayn">${d.getDate()}</div>${dots}${dts.length>3?`<div style="font-size:10px;color:var(--txt3)">+${dts.length-3} mais</div>`:''}</div>`;}).join('');const done=TASKS.filter(t=>t.status==='done').sort((a,b)=>new Date(b.completed_at||b.created_at)-new Date(a.completed_at||a.created_at));const hist=done.slice(0,10).map(t=>{const c=CLIENTS.find(x=>x.id===t.client_id);return`<div class="ir"><span class="il" style="display:flex;align-items:center;gap:8px"><i class="ti ti-circle-check" style="color:#1D9E75;font-size:14px"></i><span>${t.title}</span>${c?`<span style="color:var(--txt3);font-size:11px">· ${c.name}</span>`:''}</span><span style="font-size:11px;color:var(--txt3)">${fd((t.completed_at||t.due_date||t.created_at).slice(0,10))}</span></div>`;}).join('');area.innerHTML=`<div class="calnav"><button class="btn btn-sm" onclick="calM--;if(calM<0){calM=11;calY--;}rMonth()"><i class="ti ti-chevron-left"></i></button><h2>${mname.charAt(0).toUpperCase()+mname.slice(1)}</h2><button class="btn btn-sm" onclick="calM++;if(calM>11){calM=0;calY++;}rMonth()"><i class="ti ti-chevron-right"></i></button></div><div class="calg">${dows.map(d=>`<div class="caldow">${d}</div>`).join('')}${grid}</div><div class="card" style="margin-top:20px"><div class="ctitle"><i class="ti ti-history"></i>Histórico de tarefas concluídas</div>${hist||'<div style="color:var(--txt3);font-size:13px;padding:8px 0">Nenhuma tarefa concluída ainda</div>'}</div>`;}

function rWeek(){const area=document.getElementById('cal-area');const ws=new Date(wkKey(wkOff)+'T12:00'),days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(ws.getDate()+i);return d;}),tod=today(),dows=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];const ndT=TASKS.filter(t=>!t.due_date&&t.status!=='done');const cols=days.map((d,i)=>{const ds=d.toISOString().slice(0,10);const isT=ds===tod;const dts=TASKS.filter(t=>t.due_date===ds);return`<div class="wvc${isT?' today':''}"><div class="wvdow">${dows[i]}</div><div class="wvdate">${d.getDate()}</div>${dts.map(t=>`<div class="wvt ${t.priority}${t.status==='done'?' done':''}" onclick="openTDetail('${t.id}')"><div class="wvtt">${t.title}</div><div class="wvtc">${CLIENTS.find(x=>x.id===t.client_id)?.name||'Geral'}</div></div>`).join('')}<button class="kbadd" onclick="openTaskMod(null,'${ds}')"><i class="ti ti-plus"></i></button></div>`;}).join('');area.innerHTML=`<div class="calnav"><button class="btn btn-sm" onclick="wkOff--;rWeek()"><i class="ti ti-chevron-left"></i>Anterior</button><h2>${wkLbl(wkKey(wkOff))}</h2><button class="btn btn-sm" onclick="wkOff++;rWeek()">Próxima<i class="ti ti-chevron-right"></i></button></div><div class="wvg">${cols}</div>${ndT.length?`<div class="card" style="margin-top:16px"><div class="ctitle"><i class="ti ti-clock-off"></i>Sem data (${ndT.length})</div>${ndT.map(t=>`<div class="ir"><span class="il">${t.title}</span><div style="display:flex;gap:6px">${pB(t.priority)}<button class="btn btn-sm" onclick="openTDetail('${t.id}')"><i class="ti ti-edit"></i></button></div></div>`).join('')}</div>`:''}`;}

function openDayMod(ds){dayDate=ds;const d=new Date(ds+'T12:00');document.getElementById('md-t').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});const ts=TASKS.filter(t=>t.due_date===ds);document.getElementById('md-body').innerHTML=ts.length?ts.map(t=>{const c=CLIENTS.find(x=>x.id===t.client_id);return`<div class="ir"><span class="il" style="display:flex;align-items:center;gap:8px"><div class="tchk${t.status==='done'?' on':''}" onclick="qDone('${t.id}');openDayMod('${ds}')"></div><span style="${t.status==='done'?'text-decoration:line-through;color:var(--txt3)':''}">${t.title}</span>${c?`<span style="font-size:11px;color:var(--txt3)">· ${c.name}</span>`:''}</span><div style="display:flex;gap:6px">${pB(t.priority)}${sB(t.status)}</div></div>`;}).join(''):'<div style="color:var(--txt3);font-size:13px;padding:16px 0;text-align:center">Nenhuma tarefa neste dia</div>';openMod('m-day');}

// CHECKLIST
function rChecklist(ba){const cats=['0. Diamante','1. Ouro','2. Prata','3. Bronze'],ns=['Diamante','Ouro','Prata','Bronze'];const cl=CL[chkCat],tod=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});function pct(pk,items){if(!items.length)return 0;return Math.round(items.filter((_,i)=>CHECKS[`g|${chkCat}|${pk}|${i}`]).length/items.length*100);}const ps=[{k:'daily',l:'Diário',i:'ti-calendar-event',it:cl.daily},{k:'weekly',l:'Semanal',i:'ti-calendar-week',it:cl.weekly},{k:'monthly',l:'Mensal',i:'ti-calendar-month',it:cl.monthly}];const secs=ps.map(p=>{if(!p.it.length)return`<div class="card">Nenhuma tarefa para ${chkCat} — ${p.l}</div>`;const pc=pct(p.k,p.it);return`<div class="card"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><i class="ti ${p.i}" style="font-size:18px;color:var(--txt2)"></i><span class="ctitle" style="margin:0;flex:1">${p.l}</span><span style="font-size:12px;font-weight:700;color:var(--txt2)">${pc}%</span></div><div class="pb"><div class="pf" style="width:${pc}%"></div></div>${p.it.map((t,i)=>{const id=`g|${chkCat}|${p.k}|${i}`;const dn=!!CHECKS[id];return`<div class="ci"><div class="chk${dn?' on':''}" onclick="togChk('${id}')" role="checkbox" tabindex="0"></div><div class="cit${dn?' on':''}">${t}</div></div>`;}).join('')}</div>`;}).join('');ba.innerHTML=`<div class="vhdr"><h1>Checklists</h1><span style="font-size:13px;color:var(--txt2);margin-left:auto"><i class="ti ti-clock" style="font-size:13px"></i> ${tod}</span></div><div class="scroll"><div class="pills">${cats.map((c,i)=>`<button class="pill${chkCat===c?' on':''}" onclick="chkCat='${c}';render()">${ns[i]}</button>`).join('')}</div>${secs}</div>`;}
async function togChk(id){CHECKS[id]=!CHECKS[id];render();if(cpId)renderCp();await apiUpsert('checklist_items',{user_id:U.id,key:id,done:CHECKS[id]},'user_id,key');}

// CHECK CANAL
function rCheckCanal(ba){const wks=Array.from({length:4},(_,i)=>wkKey(-i));const prio=CLIENTS.filter(c=>['0. Diamante','1. Ouro','2. Prata'].includes(c.category));const bron=CLIENTS.filter(c=>c.category==='3. Bronze');ba.innerHTML=`<div class="vhdr"><h1>Check Canal</h1><div class="wkbar" style="margin:0 0 0 16px">${wks.map(w=>`<button class="wkb${activeWk===w?' on':''}" onclick="activeWk='${w}';render()">${w===wkKey(0)?'Esta semana':wkLbl(w)}</button>`).join('')}</div></div><div class="scroll">${prio.map(c=>rCCClient(c)).join('')}<details style="margin-top:8px"><summary style="cursor:pointer;padding:10px;font-size:13px;color:var(--txt2)">🥉 Bronze (${bron.length} clientes)</summary>${bron.map(c=>rCCClient(c)).join('')}</details></div>`;}

function rCCClient(c){return(c.channels||[]).map((ch,ci)=>{const mk=`${c.id}|${ci}|${activeWk}`;const m=METRICS[mk]||{};const ci2=CL[c.category]?.weekly||[];const dn=ci2.filter((_,i)=>CHECKS[`ch|${c.id}|${ci}|${i}`]).length;const pc=ci2.length?Math.round(dn/ci2.length*100):0;const isO=expCh[`${c.id}_${ci}`];const mfs=[{k:'vods',l:'VODs'},{k:'shorts',l:'Shorts'},{k:'lives',l:'Lives'},{k:'inscr',l:'Inscritos'},{k:'views',l:'Views'},{k:'watchtime',l:'Watchtime'},{k:'ctr',l:'CTR (%)'},{k:'cpm',l:'CPM'},{k:'rpm',l:'RPM'},{k:'receita',l:'Receita'}];return`<div class="chcard"><div class="chhd${isO?' open':''}" onclick="expCh['${c.id}_${ci}']=!expCh['${c.id}_${ci}'];render()"><div class="chicon"><i class="ti ti-brand-youtube"></i></div><div class="cx"><div style="font-size:14px;font-weight:700">${ch}</div><div style="font-size:12px;color:var(--txt2)">${c.name} · ${catB(c.category)} · ${pc}%</div></div><div style="display:flex;gap:6px;align-items:center">${pc===100?'<span class="badge bgrn"><i class="ti ti-check"></i>OK</span>':pc>0?`<span class="badge bamb">${pc}%</span>`:'<span class="badge" style="background:var(--bg2);color:var(--txt3)">Pendente</span>'}<i class="ti ti-chevron-${isO?'up':'down'}" style="font-size:16px;color:var(--txt3)"></i></div></div><div class="chbody${isO?' on':''}"><div class="ctitle" style="margin-bottom:10px"><i class="ti ti-chart-bar"></i>Métricas — ${wkLbl(activeWk)}</div><div class="mfg">${mfs.map(f=>`<div class="mff"><label>${f.l}</label><input type="text" value="${m[f.k]||''}" placeholder="—" oninput="lMet('${c.id}','${ci}','${activeWk}','${f.k}',this.value)"></div>`).join('')}</div><div style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><button class="btn btn-p btn-sm" onclick="sMet('${c.id}',${ci},'${activeWk}',this)"><i class="ti ti-device-floppy"></i>Salvar</button>${m._ts?`<span style="font-size:11px;color:var(--txt3)">${m._ts}</span>`:''}</div><div class="ctitle"><i class="ti ti-checkbox"></i>Checklist semanal · ${dn}/${ci2.length}</div><div class="pb"><div class="pf" style="width:${pc}%"></div></div>${ci2.map((t,i)=>{const id=`ch|${c.id}|${ci}|${i}`;const d=!!CHECKS[id];return`<div class="ci"><div class="chk${d?' on':''}" onclick="togChk('${id}')" role="checkbox" tabindex="0"></div><div class="cit${d?' on':''}" style="font-size:12px">${t}</div></div>`;}).join('')}</div></div>`;}).join('');}

function lMet(cid,ci,wk,f,v){const mk=`${cid}|${ci}|${wk}`;if(!METRICS[mk])METRICS[mk]={};METRICS[mk][f]=v;}
async function sMet(cid,ci,wk,btn){const mk=`${cid}|${ci}|${wk}`;const m=METRICS[mk]||{};const ts=new Date().toLocaleString('pt-BR');METRICS[mk]={...m,_ts:ts};const orig=btn.innerHTML;btn.innerHTML='<i class="ti ti-check"></i>Salvo!';setTimeout(()=>btn.innerHTML=orig,1500);
  await apiUpsert('channel_metrics',{client_id:cid,channel_index:parseInt(ci),week_key:wk,inscr:m.inscr,views:m.views,watchtime:m.watchtime,ctr:m.ctr,cpm:m.cpm,rpm:m.rpm,receita:m.receita,vods:m.vods,shorts:m.shorts,lives:m.lives},'client_id,channel_index,week_key');}

// PROJECTS
// ═══════════════════════════════════════════════
function rProjects(ba){
  const kb={todo:PROJECTS.filter(p=>p.status==='todo'),doing:PROJECTS.filter(p=>p.status==='doing'),done:PROJECTS.filter(p=>p.status==='done')};
  const cols=[{k:'todo',l:'To Do',i:'ti-circle',c:'var(--txt3)'},{k:'doing',l:'Doing',i:'ti-circle-half',c:'#BA7517'},{k:'done',l:'Done',i:'ti-circle-check',c:'#1D9E75'}];
  const kcols=cols.map(col=>`<div class="kbc"><div class="kbch"><div class="kbct"><i class="ti ${col.i}" style="color:${col.c}"></i>${col.l}<span class="badge" style="background:var(--bg3);color:var(--txt3);font-size:10px">${kb[col.k].length}</span></div></div>${kb[col.k].map(p=>`<div class="kbk"><div class="kbkt">${p.title}</div>${p.description?`<div style="font-size:12px;color:var(--txt2);margin-bottom:4px">${p.description}</div>`:''}<div class="kbkm">${pB(p.priority)}${p.due_date?`<span style="font-size:11px;color:var(--txt3)"><i class="ti ti-calendar" style="font-size:11px"></i> ${fd(p.due_date)}</span>`:''}</div><div style="display:flex;gap:4px;margin-top:8px">${col.k!=='todo'?`<button class="btn btn-sm" onclick="mvP('${p.id}','${pv(col.k)}')"><i class="ti ti-chevron-left" style="font-size:12px"></i></button>`:''} ${col.k!=='done'?`<button class="btn btn-sm" onclick="mvP('${p.id}','${nx(col.k)}')"><i class="ti ti-chevron-right" style="font-size:12px"></i></button>`:''}<button class="btn btn-sm" style="color:#A32D2D;margin-left:auto" onclick="delP('${p.id}')"><i class="ti ti-trash" style="font-size:12px"></i></button></div></div>`).join('')}<button class="kbadd" onclick="openProjMod()"><i class="ti ti-plus"></i>Adicionar</button></div>`).join('');
  ba.innerHTML=`<div class="vhdr"><h1>Projetos Especiais</h1><button class="btn btn-p btn-sm" style="margin-left:auto" onclick="openProjMod()"><i class="ti ti-plus"></i>Novo projeto</button></div><div class="scroll"><div class="kb">${kcols}</div></div>`;
}
async function mvP(id,st){const p=PROJECTS.find(x=>x.id===id);if(!p)return;p.status=st;await apiUpdate('projects',{status:st},`id=eq.${id}`);render();}
async function delP(id){if(!confirm('Remover projeto?'))return;await apiDelete('projects',`id=eq.${id}`);PROJECTS=PROJECTS.filter(p=>p.id!==id);render();}

// OKR
// ═══════════════════════════════════════════════
function rOKR(ba){
  const html=OKRS.length?OKRS.map((o,oi)=>{const krs=o.key_results||[];const avg=krs.length?Math.round(krs.reduce((s,k)=>s+(k.progress||0),0)/krs.length):0;const sc={'No prazo':'bgrn','Em risco':'bamb','Atrasado':'bred','Concluído':'bblu'}[o.status]||'bgrn';return`<div class="okro"><div class="okrh" onclick="editOKR(${oi})"><div style="flex:1"><div style="font-size:14px;font-weight:700;margin-bottom:4px">${o.objective}</div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px;color:var(--txt2)">${o.period||''}</span><span class="badge ${sc}">${o.status}</span></div></div><div style="text-align:right;margin-left:16px;flex-shrink:0"><div style="font-size:20px;font-weight:700;margin-bottom:4px">${avg}%</div><div style="width:80px;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;background:#378ADD;width:${avg}%"></div></div></div><button class="btn-icon" onclick="event.stopPropagation();delOKR(${oi})" style="margin-left:10px"><i class="ti ti-trash" style="font-size:14px;color:#A32D2D"></i></button></div>${krs.map((kr,ki)=>`<div class="okrkr"><div class="okrkrn">${ki+1}</div><div style="flex:1;min-width:0"><div style="font-size:13px;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${kr.text}</div><div class="okrpb"><div class="okrpf" style="width:${kr.progress||0}%"></div></div></div><div style="display:flex;align-items:center;gap:8px;margin-left:12px"><input type="range" min="0" max="100" value="${kr.progress||0}" style="width:80px;cursor:pointer" oninput="updKR(${oi},${ki},this.value)"><span style="font-size:12px;font-weight:700;min-width:32px">${kr.progress||0}%</span></div></div>`).join('')}</div>`;}).join(''):`<div class="empty"><i class="ti ti-target"></i><p>Nenhum OKR ainda. Crie o primeiro!</p></div>`;
  ba.innerHTML=`<div class="vhdr"><h1>OKRs</h1><button class="btn btn-p btn-sm" style="margin-left:auto" onclick="openOKRMod()"><i class="ti ti-plus"></i>Novo OKR</button></div><div class="scroll">${html}</div>`;
}
async function updKR(oi,ki,v){OKRS[oi].key_results[ki].progress=parseInt(v);await apiUpdate('okrs',{key_results:OKRS[oi].key_results},`id=eq.${OKRS[oi].id}`);rOKR(document.getElementById('main-body'));}
async function delOKR(i){if(!confirm('Remover OKR?'))return;await apiDelete('okrs',`id=eq.${OKRS[i].id}`);OKRS.splice(i,1);render();}

// CLIENT PAGE
// ═══════════════════════════════════════════════
function openCp(id){cpId=id;cpTab='overview';const c=CLIENTS.find(x=>x.id===id);if(!c)return;document.getElementById('cp').classList.add('on');bHero(c);bTabs(c);renderCp();}
function closeCp(){document.getElementById('cp').classList.remove('on');cpId=null;}
function bHero(c){document.getElementById('cp-hero').innerHTML=`<button class="btn btn-sm" onclick="closeCp()"><i class="ti ti-arrow-left"></i>Voltar</button><div class="cp-av ${avC(c.category)}">${c.photo?`<img src="${c.photo}" alt="">`:ini(c.name)}</div><div style="flex:1;min-width:0"><div class="cp-name">${c.name}</div><div class="cp-sub">${c.niche||''} · ${(c.channels||[]).length} canal${(c.channels||[]).length!==1?'is':''}</div><div style="display:flex;gap:6px;flex-wrap:wrap">${catB(c.category)}<span class="badge bgrn">${c.status||'Ativo'}</span>${c.risk!=='Baixo'?rE(c.risk):''}</div></div><div style="display:flex;gap:8px"><button class="btn btn-sm" onclick="openClientMod('${c.id}')"><i class="ti ti-edit"></i>Editar</button><button class="btn btn-sm" style="color:#A32D2D" onclick="delClient('${c.id}')"><i class="ti ti-trash"></i>Remover</button></div>`;}
const CPTBS=[{k:'overview',i:'ti-layout-dashboard',l:'Dashboard'},{k:'metrics',i:'ti-chart-bar',l:'Métricas'},{k:'docs',i:'ti-folder',l:'Documentos'},{k:'tasks',i:'ti-kanban',l:'Tarefas'},{k:'notes',i:'ti-notes',l:'Notas'}];
function bTabs(c){const fc=(FILES[c.id]||[]).length;document.getElementById('cptabs').innerHTML=CPTBS.map(t=>`<button class="cpt${cpTab===t.k?' on':''}" onclick="setCpTab('${t.k}')"><i class="ti ${t.i}"></i>${t.l}${t.k==='files'&&fc?`<span class="badge bblu" style="font-size:10px;padding:1px 5px">${fc}</span>`:''}</button>`).join('');}
function setCpTab(t){cpTab=t;const c=CLIENTS.find(x=>x.id===cpId);if(c)bTabs(c);renderCp();}
function renderCp(){const c=CLIENTS.find(x=>x.id===cpId);if(!c)return;const b=document.getElementById('cpbody');if(cpTab==='overview')b.innerHTML=cpOverview(c);else if(cpTab==='metrics'){b.innerHTML=cpMetrics(c);initCharts(c);}else if(cpTab==='docs')b.innerHTML=cpDocs(c);else if(cpTab==='tasks')b.innerHTML=cpTasks(c);else if(cpTab==='notes')b.innerHTML=cpNotes(c);}

function cpInfo(c){const ch=(c.channels||[]).map((ch,i)=>`<span class="tag"><i class="ti ti-brand-youtube" style="font-size:11px"></i>${ch}${(c.subs||[])[i]?' · '+fmtN((c.subs||[])[i]):''}</span>`).join('');return`<div class="cpsec"><div class="g2"><div class="card"><div class="ctitle"><i class="ti ti-info-circle"></i>Dados gerais</div><div class="ir"><span class="il">Status</span><span class="badge bgrn">${c.status||'Ativo'}</span></div><div class="ir"><span class="il">Risco de churn</span><span class="iv">${rE(c.risk)}</span></div><div class="ir"><span class="il">Complexidade</span><span class="iv">${c.complexity||'—'}</span></div><div class="ir"><span class="il">Modelo</span><span class="iv">${c.model||'—'}</span></div><div class="ir"><span class="il">Mínimo mensal</span><span class="iv">${c.min_fee||'—'}</span></div><div class="ir"><span class="il">Esforço CM</span><span class="iv">${c.effort||0}h/sem</span></div></div><div class="card"><div class="ctitle"><i class="ti ti-currency-dollar"></i>Receita</div><div class="ir"><span class="il">Receita canal 2025</span><span class="iv">${fmt(c.revenue_2025)}</span></div><div class="ir"><span class="il">Receita 1BMG 2025</span><span class="iv">${fmt(c.rev_1bmg)}</span></div><div class="ir"><span class="il">Média mensal</span><span class="iv">${fmt(c.rev_month)}</span></div></div></div><div class="card"><div class="ctitle"><i class="ti ti-photo"></i>Foto</div><div style="display:flex;gap:12px;align-items:center"><div class="av ${avC(c.category)}" style="width:54px;height:54px;font-size:18px;flex-shrink:0">${c.photo?`<img src="${c.photo}" alt="">`:ini(c.name)}</div><input type="text" value="${c.photo||''}" placeholder="URL da foto..." style="flex:1;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none" oninput="updPhoto('${c.id}',this.value)"></div></div><div class="card"><div class="ctitle"><i class="ti ti-brand-youtube"></i>Canais (${(c.channels||[]).length})</div><div>${ch||'<span style="color:var(--txt3);font-size:13px">Nenhum canal cadastrado</span>'}</div></div>${c.obs?`<div class="card" style="background:var(--bg2)"><div style="font-size:13px;color:var(--txt2)"><i class="ti ti-info-circle"></i> ${c.obs}</div></div>`:''}</div>`;}

function cpContact(c){return`<div class="cpsec"><div class="card"><div class="ctitle"><i class="ti ti-address-book"></i>Contato do responsável</div><div class="f2"><div class="fr"><label>E-mail</label><input type="email" value="${c.email||''}" placeholder="contato@..." style="width:100%;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none" oninput="updF('${c.id}','email',this.value)"></div><div class="fr"><label>Telefone / WhatsApp</label><input type="text" value="${c.phone||''}" placeholder="(11) 99999-9999" style="width:100%;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none" oninput="updF('${c.id}','phone',this.value)"></div></div><div class="f2"><div class="fr"><label>Aniversário</label><input type="date" value="${c.birthday||''}" style="width:100%;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none" oninput="updF('${c.id}','birthday',this.value)"></div><div class="fr"><label>Endereço</label><input type="text" value="${c.address||''}" placeholder="Cidade, Estado..." style="width:100%;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none" oninput="updF('${c.id}','address',this.value)"></div></div><button class="btn btn-p btn-sm" style="margin-top:8px" onclick="saveContact('${c.id}',this)"><i class="ti ti-device-floppy"></i>Salvar contato</button></div>${c.email||c.phone?`<div class="card" style="background:var(--bg2);margin-top:0"><div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">${c.email?`<a href="mailto:${c.email}" style="color:var(--blut);display:flex;align-items:center;gap:6px"><i class="ti ti-mail"></i>${c.email}</a>`:''} ${c.phone?`<a href="https://wa.me/${c.phone.replace(/\D/g,'')}" target="_blank" style="color:var(--grnt);display:flex;align-items:center;gap:6px"><i class="ti ti-brand-whatsapp"></i>${c.phone}</a>`:''} ${c.birthday?`<span style="color:var(--txt2);display:flex;align-items:center;gap:6px"><i class="ti ti-cake"></i>${fd(c.birthday)}</span>`:''} ${c.address?`<span style="color:var(--txt2);display:flex;align-items:center;gap:6px"><i class="ti ti-map-pin"></i>${c.address}</span>`:''}</div></div>`:''}</div>`;}

function cpTasks(c){const ct=TASKS.filter(t=>t.client_id===c.id);const cols={todo:ct.filter(t=>t.status==='todo'),doing:ct.filter(t=>t.status==='doing'),done:ct.filter(t=>t.status==='done')};const cds=[{k:'todo',l:'To Do',i:'ti-circle',c:'var(--txt3)'},{k:'doing',l:'Doing',i:'ti-circle-half',c:'#BA7517'},{k:'done',l:'Done',i:'ti-circle-check',c:'#1D9E75'}];const kc=cds.map(col=>`<div class="kbc"><div class="kbch"><div class="kbct"><i class="ti ${col.i}" style="color:${col.c}"></i>${col.l}<span class="badge" style="background:var(--bg3);color:var(--txt3);font-size:10px">${cols[col.k].length}</span></div></div>${cols[col.k].map(t=>`<div class="kbk" onclick="openTDetail('${t.id}')"><div class="kbkt">${t.title}</div>${t.description?`<div style="font-size:12px;color:var(--txt2);margin-bottom:4px">${t.description}</div>`:''}<div class="kbkm">${pB(t.priority)}${t.due_date?`<span style="font-size:11px;color:${t.due_date<today()&&t.status!=='done'?'var(--redt)':'var(--txt3)'}"><i class="ti ti-calendar" style="font-size:11px"></i> ${fd(t.due_date)}</span>`:''}</div><div style="display:flex;gap:4px;margin-top:8px">${col.k!=='todo'?`<button class="btn btn-sm" onclick="event.stopPropagation();mvT('${t.id}','${pv(col.k)}')"><i class="ti ti-chevron-left" style="font-size:12px"></i></button>`:''} ${col.k!=='done'?`<button class="btn btn-sm" onclick="event.stopPropagation();mvT('${t.id}','${nx(col.k)}')"><i class="ti ti-chevron-right" style="font-size:12px"></i></button>`:''}<button class="btn btn-sm" style="color:#A32D2D;margin-left:auto" onclick="event.stopPropagation();delT('${t.id}')"><i class="ti ti-trash" style="font-size:12px"></i></button></div></div>`).join('')}<button class="kbadd" onclick="openTaskMod('${c.id}')"><i class="ti ti-plus"></i>Adicionar</button></div>`).join('');return`<div class="cpsec"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><div style="font-size:13px;color:var(--txt2)">${ct.length} tarefas · ${cols.done.length} concluídas</div><button class="btn btn-p btn-sm" onclick="openTaskMod('${c.id}')"><i class="ti ti-plus"></i>Nova tarefa</button></div><div class="kb">${kc}</div></div>`;}

function cpChecklist(c){const cl=CL[c.category]||{daily:[],weekly:[],monthly:[]};const ps=[{k:'daily',l:'Diário',i:'ti-calendar-event',it:cl.daily},{k:'weekly',l:'Semanal',i:'ti-calendar-week',it:cl.weekly},{k:'monthly',l:'Mensal',i:'ti-calendar-month',it:cl.monthly}];return`<div class="cpsec">${ps.map(p=>{if(!p.it.length)return`<div class="card" style="margin-bottom:12px;color:var(--txt3);font-size:13px"><i class="ti ${p.i}"></i> ${p.l} — nenhuma tarefa</div>`;const dn=p.it.filter((_,i)=>CHECKS[`cl|${c.id}|${p.k}|${i}`]).length;const pc=Math.round(dn/p.it.length*100);return`<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><i class="ti ${p.i}" style="font-size:18px;color:var(--txt2)"></i><span class="ctitle" style="margin:0;flex:1">${p.l}</span><span style="font-size:12px;font-weight:700;color:var(--txt2)">${dn}/${p.it.length} · ${pc}%</span></div><div class="pb"><div class="pf" style="width:${pc}%"></div></div>${p.it.map((t,i)=>{const id=`cl|${c.id}|${p.k}|${i}`;const d=!!CHECKS[id];return`<div class="ci"><div class="chk${d?' on':''}" onclick="togChk('${id}')" role="checkbox" tabindex="0"></div><div class="cit${d?' on':''}">${t}</div></div>`;}).join('')}</div>`;}).join('')}</div>`;}

function cpFiles(c){const cf=FILES[c.id]||[];return`<div class="cpsec"><div class="uparea" onclick="document.getElementById('fi-${c.id}').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="hDrop(event,'${c.id}')"><input type="file" id="fi-${c.id}" style="display:none" multiple onchange="upFiles(this.files,'${c.id}')"><i class="ti ti-cloud-upload"></i><p style="font-size:13px;color:var(--txt2)">Clique ou arraste arquivos aqui</p><small style="font-size:11px;color:var(--txt3)">Contratos, relatórios, documentos, imagens...</small></div><div class="card"><div class="ctitle"><i class="ti ti-files"></i>Arquivos (${cf.length})</div>${cf.length?cf.map(f=>`<div class="fitem"><div class="ficon"><i class="ti ${fIcon(f.type)}"></i></div><div style="flex:1;min-width:0"><div class="fname">${f.name}</div><div class="fmeta">${fs(f.size||0)} · ${fd(f.created_at?.slice(0,10))}</div></div><div style="display:flex;gap:6px"><button class="btn-icon" onclick="dlFile('${f.path}','${f.name}')"><i class="ti ti-download" style="font-size:14px"></i></button><button class="btn-icon" onclick="delFile('${f.id}','${c.id}')"><i class="ti ti-trash" style="font-size:14px;color:#A32D2D"></i></button></div></div>`).join(''):'<div style="color:var(--txt3);font-size:13px;padding:16px 0;text-align:center">Nenhum arquivo enviado ainda</div>'}</div></div>`;}

function cpNotes(c){const n=NOTES[c.id]||{content:'',anomalies:[]};const ah=(n.anomalies||[]).length?(n.anomalies||[]).map((a,i)=>`<div class="ir"><span class="il" style="display:flex;align-items:center;gap:8px"><span class="badge bred">${a.date}</span>${a.text}</span><button class="btn btn-sm" onclick="delAnom('${c.id}',${i})"><i class="ti ti-x" style="font-size:12px"></i></button></div>`).join(''):'<div style="color:var(--txt3);font-size:13px;padding:8px 0">Nenhuma anomalia</div>';return`<div class="cpsec"><div class="g2"><div class="card"><div class="ctitle"><i class="ti ti-pencil"></i>Notas gerais</div><textarea class="nta" placeholder="Anotações, pontos de atenção..." onchange="saveNt('${c.id}','content',this.value)">${n.content||''}</textarea><button class="btn btn-p btn-sm" style="margin-top:8px" onclick="saveNtNow('${c.id}',this)"><i class="ti ti-device-floppy"></i>Salvar</button></div><div class="card"><div class="ctitle"><i class="ti ti-alert-triangle" style="color:#BA7517"></i>Histórico de anomalias</div>${ah}<div style="display:flex;gap:8px;margin-top:12px"><input type="text" id="ai-${c.id}" placeholder="Descreva a anomalia..." style="flex:1;padding:8px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none"><button class="btn btn-p btn-sm" onclick="addAnom('${c.id}')"><i class="ti ti-plus"></i>Registrar</button></div></div></div></div>`;}

async function upFiles(files,cid){if(!files.length)return;for(const f of Array.from(files)){const path=`${U.id}/${cid}/${Date.now()}_${f.name}`;const{error}=await sb.storage.from('client-files').upload(path,f);if(!error){const data=await apiInsert('files',{client_id:cid,owner_id:U.id,name:f.name,size:f.size,type:f.type,path});if(data){if(!FILES[cid])FILES[cid]=[];FILES[cid].push(data);}}}renderCp();}
function hDrop(e,cid){e.preventDefault();e.target.closest('.uparea').classList.remove('drag');upFiles(e.dataTransfer.files,cid);}
async function dlFile(path,name){const{data}=await sb.storage.from('client-files').createSignedUrl(path,60);if(data?.signedUrl){const a=document.createElement('a');a.href=data.signedUrl;a.download=name;a.click();}}
async function delFile(id,cid){if(!confirm('Remover arquivo?'))return;const f=FILES[cid]?.find(x=>x.id===id);if(f)await sb.storage.from('client-files').remove([f.path]);await apiDelete('files',`id=eq.${id}`);if(FILES[cid])FILES[cid]=FILES[cid].filter(x=>x.id!==id);renderCp();}

function openTaskMod(cid=null,due=null){taskCtx={cid,editId:null};document.getElementById('mt-t').textContent='Nova tarefa';document.getElementById('mt-title').value='';document.getElementById('mt-desc').value='';document.getElementById('mt-prio').value='med';document.getElementById('mt-due').value=due||'';document.getElementById('mt-status').value='todo';const sel=document.getElementById('mt-client');if(sel)sel.innerHTML='<option value="">— Sem cliente —</option>'+CLIENTS.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''} >${c.name}</option>`).join('');openMod('m-task');}
function openTDetail(id){const t=TASKS.find(x=>x.id===id);if(!t)return;taskCtx={cid:t.client_id,editId:id};document.getElementById('mt-t').textContent='Editar tarefa';document.getElementById('mt-title').value=t.title||'';document.getElementById('mt-desc').value=t.description||'';document.getElementById('mt-prio').value=t.priority||'med';document.getElementById('mt-due').value=t.due_date||'';document.getElementById('mt-status').value=t.status||'todo';const sel=document.getElementById('mt-client');if(sel)sel.innerHTML='<option value="">— Sem cliente —</option>'+CLIENTS.map(c=>`<option value="${c.id}"${c.id===t.client_id?' selected':''} >${c.name}</option>`).join('');openMod('m-task');}
async function saveTask(){
  const title=document.getElementById('mt-title').value.trim();
  if(!title){alert('Título obrigatório');return;}
  const selCid=document.getElementById('mt-client')?.value||'';
  const data={title,description:document.getElementById('mt-desc').value.trim(),priority:document.getElementById('mt-prio').value,due_date:document.getElementById('mt-due').value||null,status:document.getElementById('mt-status').value,owner_id:U.id,client_id:selCid||taskCtx?.cid||null};
  try{
    const eid=taskCtx?.editId;
    if(eid){if(data.status==='done'){const t=TASKS.find(x=>x.id===eid);if(t&&t.status!=='done')data.completed_at=new Date().toISOString();}await apiUpdate('tasks',data,'id=eq.'+eid);const idx=TASKS.findIndex(x=>x.id===eid);if(idx>=0)TASKS[idx]={...TASKS[idx],...data};}
    else{const ins=await apiInsert('tasks',data);if(ins)TASKS.push(ins);}
    closeMod('m-task');if(cpId)renderCp();else render();
  }catch(e){alert('Erro ao salvar tarefa: '+e.message);console.error(e);}
}
async function mvT(id,st){const t=TASKS.find(x=>x.id===id);if(!t)return;const upd={status:st};if(st==='done'&&t.status!=='done')upd.completed_at=new Date().toISOString();t.status=st;if(upd.completed_at)t.completed_at=upd.completed_at;await apiUpdate('tasks',upd,`id=eq.${id}`);if(cpId)renderCp();else render();}
async function delT(id){if(!confirm('Remover tarefa?'))return;await apiDelete('tasks',`id=eq.${id}`);TASKS=TASKS.filter(t=>t.id!==id);if(cpId)renderCp();else render();}
async function qDone(id){const t=TASKS.find(x=>x.id===id);if(!t)return;const ns=t.status==='done'?'todo':'done';const upd={status:ns};if(ns==='done')upd.completed_at=new Date().toISOString();t.status=ns;if(upd.completed_at)t.completed_at=upd.completed_at;await apiUpdate('tasks',upd,`id=eq.${id}`);render();}

taskClientFilter=null;
function rTasks(ba){

  const weekT=TASKS.filter(t=>{if(!t.due_date||t.status==='done')return false;const d=new Date(t.due_date+'T12:00'),s=new Date(wkKey(0)+'T12:00'),e=new Date(s);e.setDate(s.getDate()+6);return d>=s&&d<=e;});
  const overdue=TASKS.filter(t=>t.due_date&&t.due_date<tod&&t.status!=='done');

    <button class="tvt${taskView==='dash'?' on':''}" onclick="taskView='dash';render()"><i class="ti ti-layout-dashboard"></i>Resumo</button>
    <button class="tvt${taskView==='week'?' on':''}" onclick="taskView='week';render()"><i class="ti ti-calendar-week"></i>Semana</button>

      <div class="mc"><div class="ml">Total pendente</div><div class="mv">${pending.length}</div><div class="ms">${done.length} concluídas</div></div>
    </div>

        ${todayT.length?todayT.map(t=>tRow(t)).join(''):'<div style="color:var(--txt3);font-size:13px;padding:8px 0"><i class="ti ti-check"></i> Nenhuma tarefa para hoje</div>'}
        <button class="btn btn-sm" style="margin-top:10px" onclick="openTaskMod(null,today())"><i class="ti ti-plus"></i>Adicionar para hoje</button>
      </div>
      <div class="card"><div class="ctitle"><i class="ti ti-calendar-week"></i>Esta semana (${weekT.length})</div>
        ${weekT.length?weekT.map(t=>tRow(t)).join(''):'<div style="color:var(--txt3);font-size:13px;padding:8px 0">Nenhuma tarefa esta semana</div>'}

function tRow(t){
  const c=CLIENTS.find(x=>x.id===t.client_id),tod=today();
  const ov=t.due_date&&t.due_date<tod&&t.status!=='done';
  return`<div class="task-row">

  </div>`;

function rTaskMonth(){
  const first=new Date(calY,calM,1),last=new Date(calY,calM+1,0),mname=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),tod=today();
  let days=[],sd=first.getDay();
  for(let i=sd-1;i>=0;i--)days.push({d:new Date(calY,calM,0-i),cur:false});
  for(let i=1;i<=last.getDate();i++)days.push({d:new Date(calY,calM,i),cur:true});
  while(days.length<42)days.push({d:new Date(calY,calM+1,days.length-last.getDate()-sd+1),cur:false});
  const dows=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const grid=days.map(({d,cur})=>{const ds=d.toISOString().slice(0,10),isT=ds===tod,dts=TASKS.filter(t=>t.due_date===ds);
    return`<div class="calday${!cur?' om':''}${isT?' today':''}" onclick="openDayMod('${ds}')"><div class="caldayn">${d.getDate()}</div>${dts.slice(0,3).map(t=>`<div class="tdot ${t.status==='done'?'done':t.priority}">${t.title}</div>`).join('')}${dts.length>3?`<div style="font-size:10px;color:var(--txt3)">+${dts.length-3}</div>`:''}</div>`;

}

  const filterBar=`<div class="doc-filter-bar"><button class="doc-filter${docFilter==='all'?' on':''}" onclick="docFilter='all';renderCp()">Todos (${cf.length})</button>${DOC_TYPES.map(t=>{const cnt=cf.filter(f=>f.doc_type===t.k||(t.k==='outros'&&!f.doc_type)).length;return cnt>0?`<button class="doc-filter${docFilter===t.k?' on':''}" onclick="docFilter='${t.k}';renderCp()"><i class="ti ${t.i}" style="font-size:11px"></i> ${t.l} (${cnt})</button>`:''}).join('')}</div>`;
  const upEl=`<div style="background:var(--bg2);border:1.5px dashed var(--brd2);border-radius:var(--rl);padding:20px;margin-bottom:14px;text-align:center;cursor:pointer" onclick="document.getElementById('dfi-${c.id}').click()" ondragover="event.preventDefault();this.style.borderColor='var(--txt2)'" ondragleave="this.style.borderColor='var(--brd2)'" ondrop="hDocDrop(event,'${c.id}')"><input type="file" id="dfi-${c.id}" style="display:none" multiple onchange="uploadDoc(this.files,'${c.id}')"><i class="ti ti-cloud-upload" style="font-size:28px;color:var(--txt3);display:block;margin-bottom:8px"></i><div style="font-size:13px;color:var(--txt2);margin-bottom:6px">Arraste ou clique para enviar</div><div style="font-size:11px;color:var(--txt3)">Relatórios, contratos, documentos</div></div><div id="dum-${c.id}" style="display:none;background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:14px"><div style="font-size:12px;font-weight:600;margin-bottom:8px">Classificar:</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${DOC_TYPES.map(t=>`<button class="doc-filter" id="dt-${t.k}-${c.id}" onclick="selDocType('${t.k}','${c.id}')">${t.l}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center"><input type="month" id="dm-${c.id}" value="${new Date().toISOString().slice(0,7)}" style="padding:6px 10px;border:0.5px solid var(--brd2);border-radius:var(--r);background:var(--bg2);color:var(--txt);font-size:13px;font-family:inherit;outline:none"><button class="btn btn-p btn-sm" onclick="confirmDocUp('${c.id}')"><i class="ti ti-check"></i>Confirmar</button><button class="btn btn-sm" onclick="cancelDocUp('${c.id}')">Cancelar</button></div></div>`;
  if(docFilter!=='all'){const ti=DOC_TYPES.find(t=>t.k===docFilter);return`<div class="cpsec">${upEl}${filterBar}<div class="card"><div class="ctitle"><i class="ti ${ti?.i}" style="color:${ti?.color}"></i>${ti?.l}</div>${filt.length?filt.map(f=>fItem(f,c.id)).join(''):'<div style="color:var(--txt3);font-size:13px;padding:16px 0;text-align:center">Nenhum arquivo</div>'}</div></div>`;}
  const mFolders=months.length?months.map(mo=>{const mf=byMonth[mo];const ml=mo==='outros'?'Sem data':new Date(mo+'-01T12:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'});const ml2=ml.charAt(0).toUpperCase()+ml.slice(1);const isO=expandedMonths[mo];return`<div class="doc-month"><div class="doc-month-hd" onclick="expandedMonths['${mo}']=!expandedMonths['${mo}'];renderCp()"><i class="ti ti-folder${isO?'-open':''}" style="font-size:18px;color:#BA7517"></i><span style="flex:1">${ml2}</span><span class="badge bamb">${mf.length} arquivo${mf.length!==1?'s':''}</span><i class="ti ti-chevron-${isO?'up':'down'}" style="font-size:16px;color:var(--txt3);margin-left:8px"></i></div><div class="doc-month-body${isO?' on':''}"><div class="doc-type-grid">${DOC_TYPES.map(t=>{const tf=mf.filter(f=>f.doc_type===t.k||(t.k==='outros'&&!f.doc_type));return`<div class="doc-type" onclick="event.stopPropagation();docFilter='${t.k}';renderCp()"><div style="font-size:12px;font-weight:700;color:${t.color};margin-bottom:3px;display:flex;align-items:center;gap:5px"><i class="ti ${t.i}"></i>${t.l}</div><div style="font-size:11px;color:var(--txt3)">${tf.length} arquivo${tf.length!==1?'s':''}</div></div>`;}).join('')}</div>${mf.map(f=>fItem(f,c.id)).join('')}</div></div>`;}).join(''):'<div style="color:var(--txt3);font-size:13px;padding:24px;text-align:center"><i class="ti ti-folder" style="font-size:32px;display:block;margin-bottom:8px;opacity:.4"></i>Nenhum documento ainda</div>';
  return`<div class="cpsec">${upEl}${filterBar}<div class="doc-months">${mFolders}</div></div>`;
}

function fItem(f,cid){const ti=DOC_TYPES.find(t=>t.k===f.doc_type);return`<div class="fitem"><div class="ficon" style="background:${ti?.color+'22'||'var(--bg2)'};color:${ti?.color||'var(--txt2)'}"><i class="ti ${fIcon(f.type)}"></i></div><div style="flex:1;min-width:0"><div class="fname">${f.name}</div><div class="fmeta">${ti?.l||'Outros'} · ${fs(f.size||0)} · ${fd(f.created_at?.slice(0,10))}</div></div><div style="display:flex;gap:6px"><button class="btn-icon" onclick="dlFile('${f.path}','${f.name}')"><i class="ti ti-download" style="font-size:14px"></i></button><button class="btn-icon" onclick="delFile('${f.id}','${cid}')"><i class="ti ti-trash" style="font-size:14px;color:#A32D2D"></i></button></div></div>`;}

let pendDocFiles=null,pendDocCid=null,selDT=null;
function uploadDoc(files,cid){if(!files.length)return;pendDocFiles=files;pendDocCid=cid;selDT=null;document.getElementById('dum-'+cid).style.display='block';}
function hDocDrop(e,cid){e.preventDefault();uploadDoc(e.dataTransfer.files,cid);}
function selDocType(t,cid){selDT=t;document.querySelectorAll(`[id^="dt-"][id$="-${cid}"]`).forEach(b=>b.classList.remove('on'));document.getElementById(`dt-${t}-${cid}`)?.classList.add('on');}
async function confirmDocUp(cid){
  if(!pendDocFiles)return;
  const mo=document.getElementById('dm-'+cid)?.value||new Date().toISOString().slice(0,7),dt=selDT||'outros';
  for(const f of Array.from(pendDocFiles)){
    const path=`${U.id}/${cid}/${mo}/${dt}/${Date.now()}_${f.name}`;
    const{error}=await sb.storage.from('client-files').upload(path,f);
    if(!error){const data=await apiInsert('files',{client_id:cid,owner_id:U.id,name:f.name,size:f.size,type:f.type,path,doc_type:dt,month_key:mo});if(data){if(!FILES[cid])FILES[cid]=[];FILES[cid].push(data);}}
  }
  pendDocFiles=null;document.getElementById('dum-'+cid).style.display='none';renderCp();
}
function cancelDocUp(cid){pendDocFiles=null;document.getElementById('dum-'+cid).style.display='none';}

// PWA Service Worker
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));}
</script>
